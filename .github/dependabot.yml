# Weekly pull requests for newer build tools, test libraries, and CI actions. WPILib's libraries
# are updated deliberately, per WPILib release, not by this bot, and so is Gradle itself.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.wpilib*"
      # What WPILib's libraries are built on, kept at the versions WPILib's release uses.
      - dependency-name: "io.avaje:avaje-jsonb"
      - dependency-name: "org.ejml:ejml-simple"
      - dependency-name: "us.hebi.quickbuf:quickbuf-runtime"
      - dependency-name: "gradle-wrapper"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
