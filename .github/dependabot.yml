# Weekly pull requests for newer build tools, test libraries, and CI actions. WPILib's libraries
# are updated deliberately, per WPILib release, not by this bot, and so is Gradle itself.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.wpilib*"
      - dependency-name: "gradle-wrapper"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
